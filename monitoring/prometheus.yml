global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS-discovery: знаходить УСІ репліки сервісу (docker compose up --scale worker-html=3)
  - job_name: worker-html
    dns_sd_configs:
      - names: [worker-html]
        type: A
        port: 9100

  - job_name: worker-js
    dns_sd_configs:
      - names: [worker-js]
        type: A
        port: 9100
