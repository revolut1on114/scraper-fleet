name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # щодня: live-перевірка, чи не змінився DOM

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (fixtures)
        run: pytest -q
      - name: Offline parser smoke-check
        run: python -m app.check_parser --fixtures

  live-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Live parser check (HTML only)
        run: python -m app.check_parser --no-js
